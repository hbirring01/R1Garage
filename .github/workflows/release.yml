name: Release APK

# Builds a signed release APK and publishes it as a GitHub Release asset
# when a vX.Y.Z tag is pushed (typically by release-please).
#
# Signing: requires the following repo secrets:
#   SIGNING_KEYSTORE_BASE64  - base64-encoded PKCS#12 keystore
#   SIGNING_STORE_PASSWORD   - keystore password
#   SIGNING_KEY_PASSWORD     - private key password
#   SIGNING_KEY_ALIAS        - alias of the key inside the keystore
# When secrets are absent the build falls back to AGP's debug key (the
# resulting APK installs but cannot upgrade across machines).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # attest-build-provenance needs id-token (Sigstore OIDC) + attestations.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compute versionCode / versionName from tag
        id: ver
        run: |
          TAG="${{ github.ref_name }}"          # e.g. v1.2.3
          VERSION_NAME="${TAG#v}"               # 1.2.3
          IFS='.' read -r MAJ MIN PAT <<< "$VERSION_NAME"
          MAJ=${MAJ:-0}; MIN=${MIN:-0}; PAT=${PAT:-0}
          VERSION_CODE=$(( MAJ * 10000 + MIN * 100 + PAT ))
          echo "name=$VERSION_NAME"  >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE"  >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Decode upgrade keystore
        if: env.SIGNING_KEYSTORE_BASE64 != ''
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > app/upgrade.keystore
          echo "Decoded keystore to app/upgrade.keystore ($(stat -c%s app/upgrade.keystore) bytes)"

      - name: Assemble release APK
        run: ./gradlew assembleRelease
        env:
          RELEASE_VERSION_NAME: ${{ steps.ver.outputs.name }}
          RELEASE_VERSION_CODE: ${{ steps.ver.outputs.code }}
          SIGNING_STORE_FILE: upgrade.keystore
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}

      - name: Rename APK
        id: apk
        run: |
          mkdir -p artifacts
          SRC=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$SRC" ]; then
            echo "::error::Expected signed $SRC but it was not produced. Check signing config / secrets."
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          APK="artifacts/R1Garage-${{ github.ref_name }}.apk"
          cp "$SRC" "$APK"
          SIZE=$(du -h "$APK" | cut -f1)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      # SLSA build provenance: publishes a signed attestation to Sigstore
      # tying this APK's sha256 to this workflow run + commit.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.apk.outputs.path }}

      - name: Build changelog from commits
        id: changelog
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          PREV=$(git tag --sort=-creatordate | grep -E '^v[0-9]' | grep -v "^${TAG}$" | head -n 1 || true)
          if [ -z "$PREV" ]; then
            RANGE="HEAD"
            COMPARE=""
          else
            RANGE="${PREV}..HEAD"
            COMPARE="https://github.com/${{ github.repository }}/compare/${PREV}...${TAG}"
          fi
          echo "Computing changelog for range: $RANGE"

          feats=$(git log --no-merges --pretty=format:'- %s (%h)' $RANGE | grep -iE '^- (feat|feature)(\(.*\))?:' || true)
          fixes=$(git log --no-merges --pretty=format:'- %s (%h)' $RANGE | grep -iE '^- fix(\(.*\))?:' || true)
          ui=$(git log --no-merges --pretty=format:'- %s (%h)' $RANGE | grep -iE '^- (ui|ux|style)(\(.*\))?:' || true)
          perf=$(git log --no-merges --pretty=format:'- %s (%h)' $RANGE | grep -iE '^- perf(\(.*\))?:' || true)
          docs=$(git log --no-merges --pretty=format:'- %s (%h)' $RANGE | grep -iE '^- docs?(\(.*\))?:' || true)
          chore=$(git log --no-merges --pretty=format:'- %s (%h)' $RANGE | grep -iE '^- (chore|refactor|build|ci|test|deps)(\(.*\))?:' || true)
          other=$(git log --no-merges --pretty=format:'- %s (%h)' $RANGE \
            | grep -ivE '^- (feat|feature|fix|ui|ux|style|perf|docs?|chore|refactor|build|ci|test|deps)(\(.*\))?:' || true)

          {
            echo "## 📦 R1 Garage ${TAG}"
            echo ""
            echo "### 📲 Install"
            echo "Download **R1Garage-${TAG}.apk** from the Assets below and install on your Android device."
            echo "- Min Android: 8.0 (API 26)"
            echo "- Size: ${{ steps.apk.outputs.size }}"
            echo "- SHA-256: \`${{ steps.apk.outputs.sha256 }}\`"
            echo ""
            echo "### ✨ What's Changed"
            [ -n "$feats" ]  && { echo ""; echo "#### 🚀 Features";        echo "$feats"; }
            [ -n "$fixes" ]  && { echo ""; echo "#### 🐛 Bug Fixes";       echo "$fixes"; }
            [ -n "$ui" ]     && { echo ""; echo "#### 🎨 UI / UX";          echo "$ui"; }
            [ -n "$perf" ]   && { echo ""; echo "#### ⚡ Performance";      echo "$perf"; }
            [ -n "$docs" ]   && { echo ""; echo "#### 📚 Documentation";    echo "$docs"; }
            [ -n "$chore" ]  && { echo ""; echo "#### 🧰 Maintenance";      echo "$chore"; }
            [ -n "$other" ]  && { echo ""; echo "#### 📝 Other";            echo "$other"; }
            echo ""
            if [ -n "$COMPARE" ]; then
              echo "**Full Diff:** [\`${PREV}...${TAG}\`](${COMPARE})"
              echo ""
            fi
            echo "---"
          } > RELEASE_NOTES.md

          echo "----- Generated notes -----"
          cat RELEASE_NOTES.md

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: R1 Garage ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*.apk

  update-readme:
    name: Update README with latest release
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          # peter-evans/create-pull-request collides with the persisted
          # GITHUB_TOKEN-based credential helper, producing "Duplicate
          # header: Authorization" on the first git fetch. Disabling
          # persist-credentials lets the action manage auth itself.
          persist-credentials: false

      - name: Rewrite Latest Release block
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          python3 <<'PY'
          import os, re, datetime, pathlib

          tag  = os.environ["TAG"]
          repo = os.environ["REPO"]
          date = datetime.datetime.utcnow().strftime("%Y-%m-%d")
          apk  = f"R1Garage-{tag}.apk"
          dl   = f"https://github.com/{repo}/releases/download/{tag}/{apk}"
          rel  = f"https://github.com/{repo}/releases/tag/{tag}"

          block = (
              "<!-- LATEST_RELEASE:START -->\n"
              f"### 📦 Latest release: [`{tag}`]({rel}) — {date}\n\n"
              f"[⬇️ Download `{apk}`]({dl}) · [Release notes]({rel})\n\n"
              "```\n"
              f"adb install {apk}\n"
              "```\n"
              "<!-- LATEST_RELEASE:END -->"
          )

          p = pathlib.Path("README.md")
          text = p.read_text(encoding="utf-8")
          new = re.sub(
              r"<!-- LATEST_RELEASE:START -->.*?<!-- LATEST_RELEASE:END -->",
              block,
              text,
              count=1,
              flags=re.DOTALL,
          )
          if new == text:
              raise SystemExit("LATEST_RELEASE markers not found in README.md")
          p.write_text(new, encoding="utf-8")
          PY

          echo "----- Updated README excerpt -----"
          grep -A 6 'LATEST_RELEASE:START' README.md

      - name: Open PR with README update
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/readme-release-${{ github.ref_name }}
          base: main
          commit-message: "docs: update README for ${{ github.ref_name }}"
          title: "docs: update README for ${{ github.ref_name }}"
          body: |
            Automated README update after release **${{ github.ref_name }}**.

            - Refreshed the `LATEST_RELEASE` block with the new tag, date, and APK download link.
            - Triggered by the [Release APK workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          labels: |
            documentation
            automated
          delete-branch: true

