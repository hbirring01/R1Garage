name: Release Please

# Maintains a rolling "release PR" against main that bumps the version and
# accumulates a CHANGELOG entry from Conventional Commits. When the release
# PR is merged, release-please pushes a `vX.Y.Z` tag — which in turn fires
# `release.yml` to build and publish the APK.
#
# Conventional Commit prefixes drive the version bump:
#   feat:    → minor bump  (0.1.0 → 0.2.0)
#   fix:     → patch bump  (0.1.0 → 0.1.1)
#   feat!:   → major bump  (0.1.0 → 1.0.0)
#   chore/docs/ci/etc. → no bump, hidden from changelog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Prefer a PAT (or GitHub App token) stored as RELEASE_PLEASE_TOKEN so
      # that the PR / tag release-please opens triggers downstream workflows
      # (Android CI, CodeQL, etc.). GitHub deliberately does not run
      # `pull_request` or tag-`push` workflows for events authored by the
      # default GITHUB_TOKEN, which is why release-please PRs sit without CI.
      # Falls back to GITHUB_TOKEN when the secret is not configured — the
      # release PR will still open, but its checks will need a manual nudge
      # (empty commit / close + reopen) to run.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # GITHUB_TOKEN-created tags do NOT trigger the `push: tags: v*` event,
      # so we explicitly dispatch the APK build workflow against the new tag.
      # When RELEASE_PLEASE_TOKEN is set the tag is authored by that identity
      # and the `push` trigger would fire on its own, but dispatching is a
      # harmless no-op safety net either way.
      - name: Dispatch Release APK build for new tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          echo "Dispatching release.yml against tag $TAG"
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
