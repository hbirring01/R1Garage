name: MobSF Scan

# Android-specific SAST via mobsfscan. Catches things CodeQL doesn't:
# exported activities/providers without permissions, insecure WebView
# config, weak crypto APIs, hardcoded URLs/secrets, insecure
# SharedPreferences usage, etc. Results land in the GitHub Security tab
# via SARIF.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: mobsfscan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobsfscan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Detect README-only PR
        id: skip
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          files=$(gh pr view "$PR_NUM" --repo "$REPO" --json files --jq '.files[].path' | sort -u)
          echo "Changed files:"; echo "$files"
          if [ "$files" = "README.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::README-only PR — skipping mobsfscan"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.skip.outputs.skip != 'true'

      - name: Run mobsfscan
        if: steps.skip.outputs.skip != 'true'
        uses: MobSF/mobsfscan@3d87bc570c4614d705547bddb521395663dba353 # 0.4.5
        with:
          args: '. --sarif --output mobsfscan.sarif || true'

      - name: Upload SARIF to Security tab
        if: always() && steps.skip.outputs.skip != 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: mobsfscan.sarif
          category: mobsfscan
