# detekt configuration overlay.
#
# Merged on top of --build-upon-default-config in the Code Quality
# workflow, so this only needs to override what the defaults get wrong.
#
# Why we need this: @Composable functions are PascalCase by convention
# (Jetpack Compose API guidelines), but detekt's default FunctionNaming
# rule rejects PascalCase across the board. Telling the rule to ignore
# @Composable-annotated functions is the standard fix.
#
# `config.validation: false` is required because detekt 1.23's overlay
# validator otherwise rejects partial rule definitions in --config files
# with "Property 'style>FunctionNaming' is misspelled or does not exist"
# — the merged config is still validated, just not the overlay alone.
config:
  validation: false

style:
  FunctionNaming:
    ignoreAnnotated:
      - 'Composable'
